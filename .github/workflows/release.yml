name: Release Multi-Platform Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.1.0)"
        required: true
        default: "1.1.0"

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Determine release version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
            VER="${VER#v}"
            TAG="v${VER}"
          else
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-server:
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (for Android server.jar)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Android server.jar
        run: bash server/build.sh

      - name: Upload server.jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Server-Jar
          path: server/server.jar

  build-windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: Setup Java 17 (for Android server.jar)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build & Sign MobileMirror-Setup.exe
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ($env:SIGNPATH_API_TOKEN) {
            Write-Host "Building unsigned installer for SignPath Foundation HSM signing..."
            .\build_installer.ps1 -Version "${{ needs.meta.outputs.version }}"
          } elseif ($env:WINDOWS_PFX_BASE64) {
            Write-Host "Decoding WINDOWS_PFX_BASE64 certificate for Authenticode signing..."
            $pfxBytes = [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64)
            $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
            .\build_installer.ps1 -Version "${{ needs.meta.outputs.version }}" -PfxPath $pfxPath -PfxPassword $env:WINDOWS_PFX_PASSWORD
            Remove-Item -Force $pfxPath -ErrorAction SilentlyContinue
          } else {
            .\build_installer.ps1 -Version "${{ needs.meta.outputs.version }}" -SelfSign
          }

      - name: Upload unsigned Windows artifact for SignPath
        id: upload-unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: actions/upload-artifact@v4
        with:
          name: MobileMirror-Windows-Unsigned
          path: dist/MobileMirror-Setup.exe

      - name: Sign Windows installer via SignPath Foundation
        if: env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: "mobile-mirror"
          signing-policy-slug: "release-signing"
          artifact-configuration-slug: "exe-installer"
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileMirror-Windows
          path: dist/MobileMirror-Setup.exe

  build-macos:
    needs: [meta, build-server]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android server.jar
        uses: actions/download-artifact@v4
        with:
          name: Android-Server-Jar
          path: server

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: Install SDL3, FFmpeg, ADB, and dylibbundler via Homebrew
        run: |
          brew update
          brew install sdl3 ffmpeg dylibbundler
          brew install --cask android-platform-tools || true

      - name: Build release client binary
        working-directory: client
        run: cargo build --release

      - name: Package Mobile Mirror.app and MobileMirror-macOS.dmg
        run: |
          set -euo pipefail
          VER="${{ needs.meta.outputs.version }}"
          APP="dist/dmg-root/Mobile Mirror.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Frameworks" "$APP/Contents/Resources/platform-tools"

          cp client/target/release/mobile-mirror-client "$APP/Contents/MacOS/mobile-mirror-client"
          chmod +x "$APP/Contents/MacOS/mobile-mirror-client"
          cp server/server.jar "$APP/Contents/Resources/server.jar"

          if command -v adb >/dev/null 2>&1; then
            cp "$(command -v adb)" "$APP/Contents/Resources/platform-tools/adb"
            chmod +x "$APP/Contents/Resources/platform-tools/adb"
          fi

          # Bundle SDL3 and FFmpeg dylibs
          SDL3_PREFIX="$(brew --prefix sdl3)"
          FFMPEG_PREFIX="$(brew --prefix ffmpeg)"
          cp -RL "$SDL3_PREFIX"/lib/libSDL3*.dylib "$APP/Contents/Frameworks/" || true
          cp -RL "$FFMPEG_PREFIX"/lib/libavcodec*.dylib "$APP/Contents/Frameworks/" || true
          cp -RL "$FFMPEG_PREFIX"/lib/libavformat*.dylib "$APP/Contents/Frameworks/" || true
          cp -RL "$FFMPEG_PREFIX"/lib/libavutil*.dylib "$APP/Contents/Frameworks/" || true
          cp -RL "$FFMPEG_PREFIX"/lib/libswresample*.dylib "$APP/Contents/Frameworks/" || true

          # Fix transitive Homebrew dylib paths inside Frameworks
          for lib in "$APP"/Contents/Frameworks/*.dylib; do
            chmod u+w "$lib" || true
            dylibbundler -of -b -x "$lib" -d "$APP/Contents/Frameworks" -p "@loader_path/" || true
          done

          # Generate macOS .icns icon from app_icon.png (exact iconutil sizes)
          ICONSET="dist/AppIcon.iconset"
          mkdir -p "$ICONSET"
          for sz in 16 32 128 256 512; do
            sips -z $sz $sz client/assets/app_icon.png --out "$ICONSET/icon_${sz}x${sz}.png" >/dev/null
            sz2=$((sz * 2))
            sips -z $sz2 $sz2 client/assets/app_icon.png --out "$ICONSET/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Mobile Mirror</string>
            <key>CFBundleDisplayName</key>
            <string>Mobile Mirror</string>
            <key>CFBundleIdentifier</key>
            <string>com.mobilemirror.desktop</string>
            <key>CFBundleVersion</key>
            <string>${VER}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VER}</string>
            <key>CFBundleExecutable</key>
            <string>mobile-mirror-client</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSLocalNetworkUsageDescription</key>
            <string>Mobile Mirror advertises an AirPlay receiver on your local network so your iPhone or iPad can mirror wirelessly.</string>
            <key>NSBonjourServices</key>
            <array>
              <string>_airplay._tcp</string>
              <string>_raop._tcp</string>
            </array>
          </dict>
          </plist>
          EOF

          # Include one-click Gatekeeper Quarantine Unblocker (.command) in DMG for free builds
          cat > "dist/dmg-root/First Time Open (Bypass Gatekeeper).command" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          DIR="$(cd "$(dirname "$0")" && pwd)"
          if [ -d "/Applications/Mobile Mirror.app" ]; then
            xattr -cr "/Applications/Mobile Mirror.app" || true
            open "/Applications/Mobile Mirror.app"
          elif [ -d "$DIR/Mobile Mirror.app" ]; then
            cp -R "$DIR/Mobile Mirror.app" "/Applications/Mobile Mirror.app"
            xattr -cr "/Applications/Mobile Mirror.app" || true
            open "/Applications/Mobile Mirror.app"
          fi
          EOF
          chmod +x "dist/dmg-root/First Time Open (Bypass Gatekeeper).command"

          xattr -cr "$APP" || true
          codesign --force --deep --sign - "$APP"
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname "Mobile Mirror" -srcfolder dist/dmg-root -ov -format UDZO dist/MobileMirror-macOS.dmg

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileMirror-macOS
          path: dist/MobileMirror-macOS.dmg

  build-linux:
    needs: [meta, build-server]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android server.jar
        uses: actions/download-artifact@v4
        with:
          name: Android-Server-Jar
          path: server

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: Install Linux build & runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config dpkg-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libwayland-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            android-tools-adb

      - name: Build SDL3 shared library
        run: |
          git clone --depth 1 --branch release-3.2.8 https://github.com/libsdl-org/SDL.git /tmp/sdl3
          cmake -S /tmp/sdl3 -B /tmp/sdl3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF
          cmake --build /tmp/sdl3-build --parallel
          sudo cmake --install /tmp/sdl3-build
          sudo ldconfig

      - name: Build release client binary
        working-directory: client
        run: cargo build --release

      - name: Package Linux Tarball (.tar.gz) and Debian Installer (.deb)
        run: |
          set -euo pipefail
          VER="${{ needs.meta.outputs.version }}"
          STAGE="dist/MobileMirror-Linux-x86_64"
          mkdir -p "$STAGE/lib"

          cp client/target/release/mobile-mirror-client "$STAGE/mobile-mirror-client"
          chmod +x "$STAGE/mobile-mirror-client"
          cp server/server.jar "$STAGE/server.jar"
          cp client/assets/app_icon.png "$STAGE/app_icon.png"

          # Bundle compiled SDL3 shared library (find dynamically across GNUInstallDirs lib paths)
          SDL3_SO="$(find /tmp/sdl3-build /usr/local/lib* -maxdepth 3 -name 'libSDL3.so.0*' \( -type f -o -type l \) 2>/dev/null | head -n 1)"
          if [ -z "$SDL3_SO" ]; then
            echo "ERROR: Could not locate compiled libSDL3.so.0" >&2
            exit 1
          fi
          cp -L "$SDL3_SO" "$STAGE/lib/libSDL3.so.0"
          ln -sf libSDL3.so.0 "$STAGE/lib/libSDL3.so"

          cat > "$STAGE/mobile-mirror.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          DIR="$(cd "$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:${LD_LIBRARY_PATH:-}"
          exec "$DIR/mobile-mirror-client" "$@"
          EOF
          chmod +x "$STAGE/mobile-mirror.sh"

          cat > "$STAGE/install.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          INSTALL_DIR="${HOME}/.local/share/mobile-mirror"
          mkdir -p "$INSTALL_DIR" "${HOME}/.local/share/applications" "${HOME}/.local/bin"
          cp -r "$DIR/"* "$INSTALL_DIR/"
          chmod +x "$INSTALL_DIR/mobile-mirror.sh" "$INSTALL_DIR/mobile-mirror-client"
          ln -sf "$INSTALL_DIR/mobile-mirror.sh" "${HOME}/.local/bin/mobile-mirror"

          cat > "${HOME}/.local/share/applications/mobile-mirror.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=Mobile Mirror
          Comment=Android & iOS Screen Mirroring and Lossless MP4 Recorder
          Exec=${INSTALL_DIR}/mobile-mirror.sh
          Icon=${INSTALL_DIR}/app_icon.png
          Terminal=false
          Categories=Utility;AudioVideo;
          DESKTOP

          echo "Mobile Mirror installed to ${INSTALL_DIR}"
          echo "Note: Ensure FFmpeg and ADB are installed (e.g. sudo apt install ffmpeg adb)."
          EOF
          chmod +x "$STAGE/install.sh"

          tar -C dist -czf dist/MobileMirror-Linux-x86_64.tar.gz MobileMirror-Linux-x86_64

          # Also build a one-click Debian/Ubuntu .deb installer package
          DEB_ROOT="dist/deb-pkg"
          mkdir -p "$DEB_ROOT/DEBIAN" "$DEB_ROOT/opt/mobile-mirror" "$DEB_ROOT/usr/bin" "$DEB_ROOT/usr/share/applications"
          cp -r "$STAGE/"* "$DEB_ROOT/opt/mobile-mirror/"
          ln -sf /opt/mobile-mirror/mobile-mirror.sh "$DEB_ROOT/usr/bin/mobile-mirror"

          cat > "$DEB_ROOT/usr/share/applications/mobile-mirror.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Mobile Mirror
          Comment=Android & iOS Screen Mirroring and Lossless MP4 Recorder
          Exec=/opt/mobile-mirror/mobile-mirror.sh
          Icon=/opt/mobile-mirror/app_icon.png
          Terminal=false
          Categories=Utility;AudioVideo;
          DESKTOP

          cat > "$DEB_ROOT/DEBIAN/control" <<EOF
          Package: mobile-mirror
          Version: ${VER}
          Section: video
          Priority: optional
          Architecture: amd64
          Depends: libc6, ffmpeg, adb
          Maintainer: Mobile Mirror Contributors <https://github.com/Frontend-fuchhey/mobile-mirror>
          Description: Ultra-low-latency Android & iOS screen mirroring and MP4 recorder
          EOF

          dpkg-deb --build --root-owner-group "$DEB_ROOT" dist/MobileMirror-Linux-amd64.deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MobileMirror-Linux
          path: |
            dist/MobileMirror-Linux-x86_64.tar.gz
            dist/MobileMirror-Linux-amd64.deb

  publish-release:
    needs: [meta, build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd artifacts
          sha256sum MobileMirror-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          REPO="${{ github.repository }}"
          ls -la artifacts
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" \
              artifacts/MobileMirror-Setup.exe \
              artifacts/MobileMirror-macOS.dmg \
              artifacts/MobileMirror-Linux-x86_64.tar.gz \
              artifacts/MobileMirror-Linux-amd64.deb \
              artifacts/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" --repo "$REPO" \
              artifacts/MobileMirror-Setup.exe \
              artifacts/MobileMirror-macOS.dmg \
              artifacts/MobileMirror-Linux-x86_64.tar.gz \
              artifacts/MobileMirror-Linux-amd64.deb \
              artifacts/SHA256SUMS.txt \
              --title "Mobile Mirror ${TAG}" \
              --generate-notes
          fi

      - name: Submit updated manifest to Microsoft winget-pkgs
        if: env.WINGET_TOKEN != ''
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Frontend-fuchhey.MobileMirror
          installers-regex: '\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
